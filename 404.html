<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laura Müller — Hier ist nichts</title>
    <link rel="icon" href="favicon.png" type="image/png" />
    <style>
      :root {
        --akzent: #1e4d6b;
        --text-leise: #57534e;
        --hintergrund: #fafaf9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #1c1917;
        background: var(--hintergrund);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 4vw, 2.4rem);
        color: var(--akzent);
      }

      p {
        margin: 0 0 28px;
        max-width: 28em;
        color: var(--text-leise);
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 999px;
        background: var(--akzent);
        color: #fff;
        font-weight: 650;
        text-decoration: none;
      }

      a:hover {
        background: #163a51;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Hier ist nichts :-)</h1>
      <p>
        Diese Adresse führt ins Leere. Zurück zur Startseite — dort liegen die
        Werkzeuge zum Ausprobieren.
      </p>
      <a href="/">Zur Startseite</a>
    </div>
  </body>
</html>
